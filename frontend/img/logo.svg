<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Rounded green square -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- The letter F: stem and top bar -->
  <path d="M21 47 V19 H45" fill="none" stroke="#04130d"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The "flow": a rising line that forms the middle bar of the F -->
  <path d="M21 36 C28 36 30 30 36 31 S43 36 47 29" fill="none" stroke="#ffffff"
        stroke-width="5" stroke-linecap="round"/>
  <circle cx="47" cy="29" r="3.5" fill="#ffffff"/>
</svg>