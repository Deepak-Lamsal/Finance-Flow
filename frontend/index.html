<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanceFlow - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">F</span>
        <span class="logo-text">FinanceFlow</span>
      </div>

      <p class="nav-heading">Menu</p>
      <nav class="nav">
        <a href="index.html" class="nav-link active">Dashboard</a>
        <a href="transactions.html" class="nav-link">Transactions</a>
        <a href="#" class="nav-link">Income</a>
        <a href="#" class="nav-link">Expenses</a>
      </nav>

      <nav class="nav nav-bottom">
        <a href="settings.html" class="nav-link">Settings</a>
      </nav>
    </aside>

    <!-- Main area -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1 class="page-title">Dashboard</h1>
          <p class="page-subtitle">Your money at a glance</p>
        </div>
        <button class="btn-primary">+ Add Transaction</button>
      </header>

      <!-- Row 1: chart (wide) + summary cards (narrow column) -->
      <section class="grid-top">
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Income vs. Expenses</h2>
          </div>
          <div class="chart-box"><canvas id="trend-chart"></canvas></div>
        </div>

        <div class="summary-column">
          <div class="card">
            <p class="card-label">Total Income</p>
            <p class="card-value">NPR 0</p>
          </div>
          <div class="card">
            <p class="card-label">Total Expenses</p>
            <p class="card-value">NPR 0</p>
          </div>
          <div class="card">
            <p class="card-label">Remaining Balance</p>
            <p class="card-value">NPR 0</p>
          </div>
          <div class="card">
            <p class="card-label">Monthly Savings</p>
            <p class="card-value">NPR 0</p>
          </div>
        </div>
      </section>

      <!-- Row 2: categories (narrow) + recent transactions (wide) -->
      <section class="grid-bottom">
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Spending Categories</h2>
          </div>
          <div class="chart-box"><canvas id="category-chart"></canvas></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Recent Transactions</h2>
          </div>
          <ul class="tx-list" id="tx-list"></ul>
        </div>
      </section>
    </main>

  </div>
    <!-- Add Transaction popup (hidden until the button is clicked) -->
  <div class="modal-overlay" id="modal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 class="panel-title" id="modal-title">Add Transaction</h2>
        <button class="modal-close" id="close-modal" type="button">&times;</button>
      </div>

      <form id="transaction-form">
        <input type="hidden" name="id">
        <div class="type-toggle">
          <label>
            <input type="radio" name="type" value="expense" checked>
            <span>Expense</span>
          </label>
          <label>
            <input type="radio" name="type" value="income">
            <span>Income</span>
          </label>
        </div>

        <label class="field">
          <span>Title</span>
          <input type="text" name="title" placeholder="e.g. Lunch" required maxlength="100">
        </label>

        <label class="field">
          <span>Amount</span>
          <input type="number" name="amount" placeholder="0.00" min="0.01" step="0.01" required>
        </label>

        <label class="field">
          <span>Category</span>
          <select name="category" id="category-select" required></select>
        </label>

        <label class="field">
          <span>Date</span>
          <input type="date" name="date" required>
        </label>

        <p class="form-error" id="form-error" hidden></p>

        <button class="btn-primary btn-full" type="submit">Save Transaction</button>
      </form>
    </div>
  </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
    <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
