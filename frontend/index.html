<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanceFlow - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <!-- Sidebar navigation -->
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">F</span>
        <span class="logo-text">FinanceFlow</span>
      </div>

      <nav class="nav">
        <a href="index.html" class="nav-link active">Dashboard</a>
        <a href="transactions.html" class="nav-link">Transactions</a>
        <a href="settings.html" class="nav-link">Settings</a>
      </nav>
    </aside>

    <!-- Main content area -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1 class="page-title">Dashboard</h1>
          <p class="page-subtitle">Your money at a glance</p>
        </div>
        <button class="btn-primary">+ Add Transaction</button>
      </header>

      <!-- Summary cards (placeholders for now) -->
      <section class="cards">
        <div class="card">
          <p class="card-label">Total Income</p>
          <p class="card-value">NPR 0</p>
        </div>
        <div class="card">
          <p class="card-label">Total Expenses</p>
          <p class="card-value">NPR 0</p>
        </div>
        <div class="card">
          <p class="card-label">Remaining Balance</p>
          <p class="card-value">NPR 0</p>
        </div>
        <div class="card">
          <p class="card-label">Monthly Savings</p>
          <p class="card-value">NPR 0</p>
        </div>
      </section>
    </main>

  </div>
</body>
</html>
