<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanceFlow - Settings</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <aside class="sidebar">
      <div class="logo">
        <img src="img/logo.svg" class="logo-img" alt="FinanceFlow logo">
        <span class="logo-text">FinanceFlow</span>
      </div>

      <p class="nav-heading">Menu</p>
      <nav class="nav">
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="transactions.html" class="nav-link">Transactions</a>
        <a href="#" class="nav-link">Income</a>
        <a href="#" class="nav-link">Expenses</a>
      </nav>

      <nav class="nav nav-bottom">
        <a href="settings.html" class="nav-link active">Settings</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 class="page-title">Settings</h1>
          <p class="page-subtitle">Application preferences</p>
        </div>
      </header>

      <section class="panel settings-panel">
        <h2 class="panel-title">Currency</h2>
        <p class="settings-help">
          Changes how amounts are displayed. Your stored amounts are not converted.
        </p>

        <select id="currency-select" class="filter-input">
          <option value="NPR">NPR - Nepalese Rupee</option>
          <option value="USD">USD - US Dollar</option>
          <option value="EUR">EUR - Euro</option>
          <option value="INR">INR - Indian Rupee</option>
          <option value="GBP">GBP - British Pound</option>
        </select>

        <p class="settings-preview">Preview: <strong id="preview"></strong></p>

        <button class="btn-primary" id="save-settings" type="button">Save</button>
        <p class="settings-message" id="settings-message" hidden></p>
      </section>

      <section class="panel settings-panel">
        <h2 class="panel-title">Appearance</h2>
        <p class="settings-help">Dark theme is the default and currently the only theme.</p>
      </section>
    </main>

  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
